    session_id: {required: true, selector: {text: {}}}

charge_station_unlock:
  name: Unlock charge station smart lock
  description: Calls vehicleGwmChargeStation/smartLocks/unlock with UnlockBean fields.
  fields:
    access_code: {required: true, selector: {text: {}}}
    connector_id: {required: true, selector: {text: {}}}
    serial_number: {required: true, selector: {text: {}}}
